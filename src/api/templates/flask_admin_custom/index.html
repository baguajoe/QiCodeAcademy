{% extends 'admin/master.html' %}
{% block body %}
<div class="mt-4">
  <h3>Welcome, {{ user.name or user.email }}</h3>
  <p class="text-muted">This is the backup back-office. Use the menu above to manage records.</p>
  <div class="row mt-3">
    {% for label, value in counts.items() %}
    <div class="col-md-4 mb-3">
      <div class="card"><div class="card-body">
        <div class="text-muted small">{{ label }}</div>
        <div class="h2 mb-0">{{ value }}</div>
      </div></div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
