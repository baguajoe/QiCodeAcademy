# Nixpacks build plan used by Railway (railway.json selects the NIXPACKS builder).
# Installs BOTH Python (Flask API) and Node (webpack frontend build).
# Python phases are "setup"/"install"; Node phases are prefixed "node:".
providers = ["python", "node"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
NIXPACKS_NODE_VERSION = "20"
PYTHONUNBUFFERED = "1"

[phases.install]
# Python deps into /opt/venv.
cmds = ["python -m venv --copies /opt/venv && /opt/venv/bin/pip install --upgrade pip && /opt/venv/bin/pip install -r requirements.txt"]
paths = ["/opt/venv/bin"]

# Node commands run with LD_LIBRARY_PATH cleared: the Python provider puts an older
# libstdc++ on that path, which crashes Node 20 ("CXXABI_1.3.15 not found").
# Node is only needed at build time, so this doesn't affect the running app.
[phases."node:install"]
# Include devDependencies: webpack and babel are dev deps.
cmds = ["env -u LD_LIBRARY_PATH npm ci --include=dev --no-audit --no-fund"]

[phases."node:build"]
# Production webpack build → dist_manual/ (served by Flask).
cmds = ["env -u LD_LIBRARY_PATH npm run build"]

[phases.release]
# Nixpacks turns the Procfile "release" line (kept for Render/Heroku) into a BUILD-time
# phase, but there's no database during a Railway build. Migrations + seed run in
# Railway's pre-deploy step instead (railway.json → scripts/railway-predeploy.sh).
cmds = ["echo 'Migrations run in the Railway pre-deploy step.'"]

[start]
cmd = "bash scripts/railway-start.sh"
